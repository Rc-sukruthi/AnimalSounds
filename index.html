<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id = "message">Hear to what the animal say!</h1>
   
   
    <button class="animal-button" onclick="lion()"><img src="images/lion.jpg" alt="">Lion</button>
    <button class="animal-button" onclick="elephant()"><img src="images/elephant.jpg" alt="">Elephant</button>
    <button class="animal-button" onclick="monkey()"><img src="images/monkey.jpg" alt="">Monkey</button>
    <button class="animal-button" onclick="dog()"><img src="images/dog.jpg" alt="">Dog</button>
    <button class="animal-button" onclick="stopSound()">Stop Sound</button>
    
    <script src="script.js"></script>
</body>
</html>
